
name: Football Analyzer V9 Automat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza bibliotecile
        run: pip install -r requirements.txt

      - name: Ruleaza analiza automata
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "import football_analyzer_v9_7_actualizat as a; print(a.scheduled_analysis()); print(a.update_final_scores())"
